<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 140" role="img" aria-label="Markdown to build.js to HTML pipeline diagram">
  <rect x="0" y="0" width="480" height="140" fill="#f4f4f5" rx="10"/>

  <rect x="20" y="45" width="120" height="50" rx="8" fill="#ffffff" stroke="#d0d0d3" stroke-width="2"/>
  <text x="80" y="75" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#1a1a1a">Markdown</text>

  <rect x="180" y="45" width="120" height="50" rx="8" fill="#ffffff" stroke="#d0d0d3" stroke-width="2"/>
  <text x="240" y="75" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#1a1a1a">build.js</text>

  <rect x="340" y="45" width="120" height="50" rx="8" fill="#ffffff" stroke="#d0d0d3" stroke-width="2"/>
  <text x="400" y="75" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#1a1a1a">HTML</text>

  <line x1="140" y1="70" x2="176" y2="70" stroke="#6b6b6b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="300" y1="70" x2="336" y2="70" stroke="#6b6b6b" stroke-width="2" marker-end="url(#arrow)"/>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b6b6b"/>
    </marker>
  </defs>
</svg>
