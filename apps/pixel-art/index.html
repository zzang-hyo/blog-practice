<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>픽셀 아트 에디터</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <h1>픽셀 아트 에디터</h1>
    <a href="../../index.html" class="back-link">← 블로그로</a>
  </header>

  <main>
    <section class="canvas-area" aria-label="그리기 영역">
      <div id="pixel-grid" class="pixel-grid" role="grid" aria-label="16x16 픽셀 캔버스"></div>
    </section>

    <section class="tool-area" aria-label="도구">
      <div class="current-color-row">
        <span>현재 색상</span>
        <div id="current-color-preview" aria-hidden="true"></div>
      </div>

      <div class="palette-grid" id="palette-grid">
        <!-- 16 preset swatches, generated by JS -->
      </div>

      <div class="custom-color-row">
        <label for="custom-color">커스텀 색상</label>
        <input type="color" id="custom-color" value="#ff0000" aria-label="커스텀 색상 선택">
      </div>

      <button type="button" id="eraser-btn" class="tool-btn">지우개</button>
      <button type="button" id="clear-btn" class="tool-btn danger">전체 지우기</button>
      <button type="button" id="save-btn" class="tool-btn primary">PNG로 저장</button>
    </section>
  </main>

  <footer class="site-footer">
    <p>격자를 클릭하거나 드래그해서 16x16 픽셀 아트를 그려보세요. 모바일에서는 손가락으로 그릴 수 있습니다.</p>
  </footer>

  <canvas id="export-canvas" hidden></canvas>

  <script src="script.js"></script>
</body>
</html>
