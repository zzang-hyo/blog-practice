<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>2048</title>
  <meta name="description" content="4x4 그리드에서 같은 숫자 타일을 합쳐 2048을 만드는 퍼즐 게임" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1>2048</h1>
      <p class="subtitle">같은 숫자 타일을 합쳐 <strong>2048</strong>을 만들어보세요!</p>
    </header>

    <div class="controls">
      <div class="scoreboard">
        <div class="score-box">
          <span class="score-label">SCORE</span>
          <span id="score" class="score-value">0</span>
        </div>
        <div class="score-box best-box">
          <span class="score-label">BEST</span>
          <span id="best-score" class="score-value">0</span>
        </div>
      </div>
      <button id="new-game-btn" type="button">새 게임</button>
    </div>

    <main>
      <div class="board-wrap">
        <div id="board" class="board" role="grid" aria-label="2048 게임 보드">
          <!-- 배경 셀 16개 + 타일은 game.js가 렌더링 -->
        </div>

        <div id="game-over-overlay" class="overlay game-over" hidden>
          <p class="overlay-title">게임 오버!</p>
          <p class="overlay-score">최종 점수: <span id="final-score">0</span></p>
          <button id="restart-btn" type="button">다시 시작</button>
        </div>

        <div id="win-overlay" class="overlay win" hidden>
          <p class="overlay-title">You Win! 🎉</p>
          <div class="overlay-actions">
            <button id="keep-playing-btn" type="button">계속하기</button>
            <button id="win-new-game-btn" type="button">새 게임</button>
          </div>
        </div>
      </div>
    </main>

    <p class="instructions">
      방향키 또는 화면을 스와이프해서 타일을 움직이세요. 같은 숫자의 타일이 만나면 합쳐집니다.
    </p>

    <footer class="app-footer">
      <a href="../../index.html">← 블로그로</a>
    </footer>
  </div>

  <script src="game.js"></script>
</body>
</html>
